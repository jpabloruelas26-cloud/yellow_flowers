<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores para ti 🌻❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>
  <div class="fx-bg" id="fxBg"></div>

  <div class="player" id="player">
    <div class="player-art">
      <img src="taylor.webp" alt="Lover - Taylor Swift" class="album-art">
    </div>
    <div class="player-info">
      <div class="player-text">
        <span class="player-title">Daylight</span>
        <span class="player-artist">Taylor Swift · Lover</span>
      </div>
      <div class="player-progress">
        <span class="player-time" id="timeCurrent">1:30</span>
        <input type="range" id="seek" class="seek" min="0" max="100" value="0" step="0.1">
        <span class="player-time" id="timeTotal">0:00</span>
      </div>
    </div>
    <button class="player-toggle" id="playToggle" aria-label="Reproducir">
      <svg id="iconPlay" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <div class="player-volume">
      <span class="vol-icon">🔊</span>
      <input type="range" id="volume" class="volume" min="0" max="100" value="30">
    </div>
    <audio id="audio" preload="metadata">
      <source src="Taylor%20Swift%20-%20Daylight%20%28Official%20Audio%29.mp3" type="audio/mpeg">
    </audio>
  </div>

  <main class="card">
    <div class="scene">
      <svg id="tree" class="tree" viewBox="0 0 300 320">
        <defs>
          <linearGradient id="trunkGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4a2a14"/>
            <stop offset="45%" stop-color="#8a5a34"/>
            <stop offset="100%" stop-color="#4a2a14"/>
          </linearGradient>
        </defs>
        <ellipse class="ground-shadow" cx="150" cy="316" rx="68" ry="9" />
        <path class="root root-l" d="M150 312 C 136 317 120 318 106 312" />
        <path class="root root-r" d="M150 312 C 164 317 180 318 194 312" />
        <path class="trunk" d="M140 318 C 141 290, 145 255, 147 218 L 153 218 C 155 255, 159 290, 160 318 Z" />
        <path class="branch b1" d="M150 260 C 130 230, 110 210, 90 190" />
        <path class="branch b2" d="M150 250 C 170 220, 190 200, 210 180" />
        <path class="branch b3" d="M150 230 C 145 200, 140 180, 150 150" />
        <path class="branch b4" d="M150 240 C 120 210, 100 190, 70 170" />
        <path class="branch b5" d="M150 235 C 180 205, 200 185, 230 165" />
      </svg>
      <div class="flowers" id="flowers"></div>
      <div class="petals" id="petals"></div>
    </div>

    <div class="content">
      <p class="typewriter" id="typewriter"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
